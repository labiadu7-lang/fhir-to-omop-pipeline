        tests:
          - relationships:
              to: ref('LOCATION')
              field: location_id
      - name: provider_id
        tests:
          - relationships:
              to: ref('PROVIDER')
              field: provider_id
      - name: care_site_id
        tests:
          - relationships:
              to: ref('CARE_SITE')
              field: care_site_id

  - name: PROCEDURE_OCCURRENCE
    columns:
      - name: procedure_occurrence_id
        tests:
          - unique
