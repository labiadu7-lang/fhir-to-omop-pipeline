              field: person_id
      - name: visit_occurrence_id
        tests:
          - not_null
          - relationships:
              to: ref('VISIT_OCCURRENCE')
              field: visit_occurrence_id
      - name: provider_id
        tests:
          - relationships:
              to: ref('PROVIDER')
              field: provider_id
      - name: visit_detail_id
        tests:
          - relationships:
              to: ref('VISIT_DETAIL')
              field: visit_detail_id

  - name: PROVIDER
    columns:
